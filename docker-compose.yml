version: '3.8'

services:
  drugfx:
    build:
      context: .
      dockerfile: Dockerfile
    image: drugfx:latest
    container_name: drugfx-app
    ports:
      - "8000:8000"
    env_file:
      - project/.env
    restart: unless-stopped
    volumes:
      - ./project/logs:/app/project/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
